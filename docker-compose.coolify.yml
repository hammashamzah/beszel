# Beszel on vienna-1, deployed by Coolify from the `vienna` branch.
# Coolify rebuilds and redeploys on every push to that branch.
#
# - beszel:               the hub, built from this repo (coolify/Dockerfile.hub)
# - beszel-agent:         upstream agent; talks to the hub over a shared unix socket
# - beszel-docker-proxy:  read-only Docker API proxy that names containers after
#                         their Coolify labels; the agent has no Docker socket itself
# - beszel-app-alerts:    per-app CPU and memory alerts to Discord, which Beszel
#                         itself only does for the host as a whole
services:
  beszel:
    build:
      context: .
      dockerfile: coolify/Dockerfile.hub
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_BESZEL_8090
      - APP_URL=https://beszel.kudcrafts.com
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3

  beszel-agent:
    # pinned to the hub's version so it cannot run ahead of it
    image: henrygd/beszel-agent:0.20.0
    restart: unless-stopped
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY}
      - DOCKER_HOST=unix:///proxy/docker.sock
    volumes:
      - beszel_socket:/beszel_socket
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_docker_proxy:/proxy
    depends_on:
      - beszel-docker-proxy
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3

  beszel-docker-proxy:
    build:
      context: coolify/docker-proxy
    restart: unless-stopped
    environment:
      - LISTEN=/proxy/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel_docker_proxy:/proxy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.socket(socket.AF_UNIX);s.connect('/proxy/docker.sock')"]
      interval: 30s
      timeout: 5s
      retries: 3

  beszel-app-alerts:
    build:
      context: coolify/app-alerts
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - HOST_LABEL=vienna-1
      - CPU_LIMIT_PERCENT=200
      - MEMORY_LIMIT_GB=2
      - FOR_MINUTES=10
      - DOCKER_SOCK=/proxy/docker.sock
    volumes:
      - beszel_docker_proxy:/proxy
    depends_on:
      - beszel-docker-proxy
    healthcheck:
      test: ["CMD", "python3", "/app/app_alerts.py", "--healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
  beszel_docker_proxy:
